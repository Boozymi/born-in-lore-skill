<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Achilles – chapter II "Fifty Ships"</title>
<style>html, body { margin: 0; padding: 0; background: #000; overflow: hidden; } #stage { width: 1920px; height: 1080px; } svg { display: block; }</style>
</head>
<body>
<div id="stage"></div>
<script src="../lib/cast.js"></script>
<script src="../lib/cast2.js"></script>
<script src="../lib/props.js"></script>
<script src="../lib/scene.js"></script>
<script src="../lib/sets.js"></script>
<script src="../lib/runner.js"></script>
<script>
// Chapter II "Fifty Ships" (EPISODE.md, part 4). Comedic and fast: the fleet, the map gag, "Long story.", Cycnus and the
// bending sword, "Problem solved.", the comment call (freeze, empty cradles, the quill, the laurel), the raids, the heel,
// Agamemnon (parasol, the two loot piles) and the face-off. Every shot cues on the narrator's words (?words=…).
const K = window.CAST, K2 = window.CAST2, PR = window.PROPS, S = window.SCENE, T = window.SETS;
const { C, INK } = K;
const { ease, easeOut, win, lerp, popLabel, arrow, strike, stamp, motes, blink } = S;
const TEXT = `You sail with fifty ships of your own soldiers, the Myrmidons. The whole Greek fleet sets off for Troy, and lands in the wrong country. Long story. When you finally reach Troy, the man waiting for you on the beach is Cycnus, a son of Poseidon. No blade can cut him. So you strangle him with his own helmet strap. Problem solved. Quick pause. Whose life should we live next? Write a name in the comments. The most liked one wins. Then come years of raids. You take city after city. Nothing touches you. Well, almost nothing. They start calling you swift-footed Achilles. Your boss is Agamemnon, king of all the Greeks. He's never at the front, and he always takes the biggest share. He's the king. But you're the best of the Greeks. That's a problem.`;
const bob = (f, k = 0) => Math.sin((f + k * 13) / 14) * 3.5;
const HAND = `font-family="Segoe Print, Ink Free, Comic Sans MS, cursive" font-weight="700"`;
const SERIF = `font-family="Constantia, Palatino Linotype, Georgia, serif"`;
const ITAL = `font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-style="italic"`;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
// camera with exact targets: SCENE.camera multiplies every move by 2.4 – here the keys are the real end points
const cam = (l, keys) => { const b = keys[0]; return S.camera(l, keys.map((k, i) => i ? [k[0], b[1] + (k[1] - b[1]) / 2.4, b[2] + (k[2] - b[2]) / 2.4, b[3] + (k[3] - b[3]) / 2.4] : k)); };
const fig = (x, y, s, svg, rot = 0) => `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})${rot ? ` rotate(${rot.toFixed(2)})` : ''} scale(${s})">${svg}</g>`;
// a four-point sparkle (glints, hits); t 0..1 = its life
function spark(x, y, t, z = 30, col = '#fff8d0') {
  if (t <= 0 || t >= 1) return '';
  const k = Math.sin(t * Math.PI) * 1.3, q = z * 0.27;
  return `<path transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${(t * 50).toFixed(0)}) scale(${k.toFixed(2)})" d="M0,-${z} L${q},-${q} L${z},0 L${q},${q} L0,${z} L-${q},${q} L-${z},0 L-${q},-${q} Z" fill="${col}" stroke="${INK}" stroke-width="3"/>`;
}
// an impact burst: short white strokes flying out (t 0..1)
function burst(x, y, t, r = 50, n = 9, col = '#fff6d0') {
  if (t <= 0 || t >= 1) return '';
  let s = '';
  for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2 + 0.3, r0 = r * (0.4 + t), r1 = r * (0.8 + 1.4 * t);
    s += `<path d="M${(x + Math.cos(a) * r0).toFixed(1)},${(y + Math.sin(a) * r0).toFixed(1)} L${(x + Math.cos(a) * r1).toFixed(1)},${(y + Math.sin(a) * r1).toFixed(1)}" stroke="${col}" stroke-width="${(9 * (1 - t) + 2).toFixed(1)}" stroke-linecap="round" opacity="${(1 - t).toFixed(2)}"/>`; }
  return s;
}

// ---------- small sets and objects of this chapter ----------
// the dark wooden table under the maps; gx/gy = where the lamp light falls
function woodTable(f, o = {}) {
  let g = T.sky('wood');
  for (let i = 0; i < 9; i++) g += `<path d="M-100,${i * 130 + 40} Q960,${(i * 130 + 20 + Math.sin(i) * 20).toFixed(0)} 2020,${i * 130 + 50}" stroke="#2e1d13" stroke-width="5" fill="none" opacity="0.7"/>`;
  return g + `<circle cx="${o.gx ?? 760}" cy="${o.gy ?? 420}" r="900" fill="${o.glow || '#ffcf8a'}" opacity="${o.go ?? 0.13}" filter="url(#soft)"/>`;
}
const MAPT = 'translate(960 560) scale(1.22) rotate(-1.5)';
const mapXY = ([x, y]) => { const a = -1.5 * Math.PI / 180; return [960 + 1.22 * (x * Math.cos(a) - y * Math.sin(a)), 560 + 1.22 * (x * Math.sin(a) + y * Math.cos(a))]; };
// the "Long story." scroll: a top roller, paper that keeps rolling down (len px), squiggle lines and tiny doodles of events
function longScroll(len, f) {
  const w = 600, x = 960, top = 150, ink2 = '#5a4636';
  const doodle = (k, y) => {
    const cx = x - 40 + (k % 2) * 80;
    if (k % 3 === 0) return `<g transform="translate(${cx} ${y})"><path d="M-46,0 Q0,18 46,0 L38,-8 L-38,-8 Z" fill="none" stroke="${ink2}" stroke-width="4"/><path d="M0,-8 L0,-46 M-20,-42 L20,-42 L16,-16 L-16,-16 Z" fill="none" stroke="${ink2}" stroke-width="4" stroke-linejoin="round"/></g>`;
    if (k % 3 === 1) return `<g transform="translate(${cx} ${y})"><path d="M-40,-10 q0,-26 26,-22 q10,-20 32,-8 q26,-4 24,22 Z" fill="none" stroke="${ink2}" stroke-width="4"/><path d="M4,-6 L-6,14 L6,14 L-4,34" fill="none" stroke="#c8302a" stroke-width="5" stroke-linejoin="round"/></g>`;
    return `<g transform="translate(${cx} ${y - 10})"><path d="M-34,-24 L34,24 M34,-24 L-34,24" stroke="${ink2}" stroke-width="6" stroke-linecap="round"/><path d="M-40,-14 L-24,-30 M40,-14 L24,-30" stroke="${ink2}" stroke-width="5" stroke-linecap="round"/></g>`;
  };
  let body = `<text x="${x}" y="${top + 100}" ${SERIF} font-weight="700" font-size="66" text-anchor="middle" fill="#7a2f1e" letter-spacing="5">LONG STORY</text>
    <path d="M${x - 230},${top + 130} L${x + 230},${top + 130}" stroke="#a5865a" stroke-width="4"/>`;
  for (let i = 0; i < 46; i++) {
    const y = top + 190 + i * 46, a = S.rnd(i + 3);
    if (y > top + len + 40) break;
    if (i % 5 === 3) { body += doodle(Math.floor(i / 5), y + 8); continue; }
    const x0 = x - w / 2 + 56, L = 330 + a * 150;
    let d = `M${x0},${y}`;
    for (let k = 0; k < L; k += 26) d += ` q6.5,-${(7 + (k * 3 + i) % 5).toFixed(0)} 13,0 q6.5,${(7 + (k + i) % 4).toFixed(0)} 13,0`;
    body += `<path d="${d}" fill="none" stroke="${ink2}" stroke-width="4" stroke-linecap="round"/>`;
  }
  const spin = (f * 9) % 40;
  return `<defs><clipPath id="lsc"><rect x="${x - w / 2}" y="${top}" width="${w}" height="${len.toFixed(0)}"/></clipPath></defs>
    <rect x="${x - w / 2 + 16}" y="${top + 20}" width="${w}" height="${len.toFixed(0)}" fill="#000" opacity="0.28"/>
    <rect x="${x - w / 2}" y="${top}" width="${w}" height="${len.toFixed(0)}" fill="#f1e2bf" stroke="${INK}" stroke-width="6"/>
    <rect x="${x - w / 2 + 16}" y="${top + 6}" width="${w - 32}" height="${Math.max(0, len - 12).toFixed(0)}" fill="none" stroke="#d9c49a" stroke-width="3"/>
    <g clip-path="url(#lsc)">${body}</g>
    <rect x="${x - w / 2 - 28}" y="${top - 30}" width="${w + 56}" height="42" rx="21" fill="#c9a46c" stroke="${INK}" stroke-width="6"/>
    <g transform="translate(0 ${(top + len).toFixed(0)})"><rect x="${x - w / 2 - 28}" y="-18" width="${w + 56}" height="48" rx="24" fill="#c9a46c" stroke="${INK}" stroke-width="6"/>
      ${[0, 1, 2, 3].map(k => `<path d="M${x - w / 2 - 6 + k * 40 + spin},-14 l0,40 M${x + w / 2 + 6 - k * 40 - spin},-14 l0,40" stroke="#a5865a" stroke-width="5"/>`).join('')}</g>`;
}
// the sword that bends: from the guard at (x, y) along angle a0 (degrees), drooping by `bend` (0 straight .. 1 noodle)
function bentSword(x, y, a0, len, bend) {
  const N = 18, pts = [];
  let px = x, py = y;
  for (let i = 0; i <= N; i++) {
    pts.push([px, py]);
    const s = i / N, a = (a0 * Math.PI / 180) + bend * 1.05 * s * s;
    px += Math.cos(a) * len / N; py -= Math.sin(a) * len / N;
  }
  const d = 'M' + pts.map(([a, b]) => `${a.toFixed(1)},${b.toFixed(1)}`).join(' L');
  const [tx, ty] = pts[N], [qx, qy] = pts[N - 1], ang = Math.atan2(ty - qy, tx - qx) * 180 / Math.PI;
  return `<path d="${d}" fill="none" stroke="${INK}" stroke-width="40" stroke-linecap="butt" stroke-linejoin="round"/>
    <path d="${d}" fill="none" stroke="#dfe4e8" stroke-width="30" stroke-linejoin="round"/>
    <path d="${d}" fill="none" stroke="#f8fafb" stroke-width="7" stroke-linejoin="round" transform="translate(0 -6)"/>
    <path transform="translate(${tx.toFixed(1)} ${ty.toFixed(1)}) rotate(${ang.toFixed(1)})" d="M-2,-19 L34,0 L-2,19 Z" fill="#dfe4e8" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>`;
}
// Achilles' foot in close-up, side view, toes to the LEFT and the bare heel to the right. Origin: the ground under the heel.
function heelFoot() {
  const sk = C.skin, skS = C.skinS;
  let s = K.limb(-60, -760, -40, -170, 150, sk, skS);
  s += K.cel(a => `<path d="M-142,-720 Q-56,-752 32,-722 L22,-300 Q-56,-276 -128,-300 Z" ${a}/>`, C.bronze, C.bronzeS, -0.22, 0, 90);
  s += `<path d="M-120,-660 Q-56,-640 10,-664 M-112,-560 Q-60,-540 8,-562" fill="none" stroke="${C.bronzeS}" stroke-width="6" stroke-linecap="round"/>
    <path d="M-110,-700 Q-118,-520 -104,-330" fill="none" stroke="${C.bronzeL}" stroke-width="9" stroke-linecap="round"/>`;
  const footD = `M46,-230 Q86,-120 74,-40 Q70,-4 30,0 L-330,0 Q-392,-4 -390,-44 Q-386,-84 -322,-96 Q-200,-112 -122,-168 Q-96,-196 -92,-240 Z`;
  s += K.cel(a => `<path d="${footD}" ${a}/>`, sk, skS, -0.08, -0.12, 200);
  for (const [x, y, r] of [[-392, -26, 20], [-372, -54, 16]]) s += `<circle cx="${x}" cy="${y}" r="${r}" fill="${sk}" stroke="${INK}" stroke-width="4"/>`;
  s += `<path d="M-410,2 L96,2 L100,26 Q-150,34 -416,26 Z" fill="${C.leather}" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>`;
  // two sandal straps over the foot (seen from the side: bands from the sole up over the instep)
  for (const [xb, xt, yt] of [[-290, -262, -92], [-170, -134, -150]]) s += `<path d="M${xb},2 Q${(xb + xt) / 2 - 10},${yt / 2} ${xt},${yt}" fill="none" stroke="${INK}" stroke-width="26" stroke-linecap="round"/><path d="M${xb},2 Q${(xb + xt) / 2 - 10},${yt / 2} ${xt},${yt}" fill="none" stroke="${C.leather}" stroke-width="16" stroke-linecap="round"/>`;
  s += `<path d="M-262,-92 Q-200,-130 -134,-150" fill="none" stroke="${INK}" stroke-width="20" stroke-linecap="round"/><path d="M-262,-92 Q-200,-130 -134,-150" fill="none" stroke="${C.leather}" stroke-width="11" stroke-linecap="round"/>`;
  s += `<path d="M-128,-250 Q-40,-226 48,-252" fill="none" stroke="${INK}" stroke-width="24" stroke-linecap="round"/><path d="M-128,-250 Q-40,-226 48,-252" fill="none" stroke="${C.leather}" stroke-width="15" stroke-linecap="round"/>`;
  s += `<path d="M58,-150 Q76,-80 60,-30" fill="none" stroke="${skS}" stroke-width="6" stroke-linecap="round" opacity="0.7"/>`;
  return s;
}
// a hand-drawn coast map that fills the stage (the raids): sea on the left with islands, land on the right, a river,
// roads, hills; CITIES are the places that get a flag
const CITIES = [[1060, 210], [1420, 300], [560, 380], [1170, 500], [1580, 600], [1010, 740], [1390, 840], [600, 880]];
function coastMap(f) {
  const cx = y => 820 + 60 * Math.sin(y / 90) + 38 * Math.sin(y / 37 + 1);
  let coast = '';
  for (let y = -220; y <= 1300; y += 20) coast += `${coast ? ' L' : 'M'}${cx(y).toFixed(1)},${y}`;
  const sea = `M-220,-220 L${coast.slice(1)} L-220,1300 Z`;
  let g = `<rect x="-220" y="-220" width="2360" height="1520" fill="url(#parch)"/>`;
  g += `<path d="${sea}" fill="#bcd3c6"/><path d="${coast}" fill="none" stroke="#cfae76" stroke-width="14" opacity="0.6" transform="translate(8 6)"/><path d="${coast}" fill="none" stroke="${INK}" stroke-width="5"/>`;
  for (let i = 0; i < 14; i++) { const a = S.rnd(i + 140), b = S.rnd(i + 160); g += `<path d="M${(60 + a * 600).toFixed(0)},${(40 + b * 1000).toFixed(0)} q14,-10 28,0 q14,10 28,0" fill="none" stroke="#9dbcae" stroke-width="4"/>`; }
  for (const [x, y, rx, ry] of [[560, 404, 120, 66], [600, 904, 130, 70], [300, 640, 60, 34], [380, 180, 44, 26]]) g += `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="#ead3a0" stroke="${INK}" stroke-width="4"/>`;
  g += `<path d="M1960,120 Q1700,260 1520,420 Q1380,560 1300,700 Q1220,820 ${cx(930).toFixed(0)},930" fill="none" stroke="#7fb2c9" stroke-width="12" stroke-linecap="round"/>`;
  g += `<path d="M1060,210 Q1240,250 1420,300 M1170,500 Q1380,540 1580,600 M1010,740 Q1200,800 1390,840 M1060,210 Q1120,360 1170,500 Q1090,620 1010,740" fill="none" stroke="#a5865a" stroke-width="5" stroke-dasharray="4 14" stroke-linecap="round"/>`;
  for (const [x, y] of [[1300, 160], [1700, 420], [1250, 380], [1800, 760], [1160, 960], [1600, 980], [1500, 160], [1880, 1000]]) g += `<path d="M${x - 26},${y + 12} L${x},${y - 16} L${x + 26},${y + 12}" fill="none" stroke="#a5865a" stroke-width="5" stroke-linejoin="round"/>`;
  g += `<g transform="translate(250 960)"><circle r="54" fill="none" stroke="#7a5a3a" stroke-width="4"/><path d="M0,-70 L12,0 L0,70 L-12,0 Z" fill="#7a5a3a"/><path d="M-70,0 L0,-10 L70,0 L0,10 Z" fill="#a5865a"/></g>`;
  return g;
}
// an arrow that flies at (hx, hy) from one side (dir -1 = from the left), hits at frame h and bounces off spinning
function bouncer(f, h, hx, hy, dir, o = {}) {
  const d = f - h;
  if (d < -7) return '';
  const len = o.len || 220;
  if (d < 0) { const t = (d + 7) / 7, x = hx + dir * (1 - t) * 1100, y = hy - (1 - t) * 160 * (o.arc ?? 1);
    return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${dir < 0 ? 8 : 172})">${o.spear ? PR.spear({ len: 520, angle: 90 }) : PR.arrowShaft({ len, s: 1.35 })}</g>`; }
  if (d > 26) return '';
  const vx = dir * (9 + (o.k || 0) % 3 * 2), vy = -15 - ((o.k || 0) % 2) * 4;
  const x = hx + vx * d, y = hy + vy * d + 0.95 * d * d, rot = (dir < 0 ? 8 : 172) + dir * -28 * d;
  return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot.toFixed(1)})" opacity="${(1 - win(d, 18, 26)).toFixed(2)}">${o.spear ? PR.spear({ len: 520, angle: 90 }) : PR.arrowShaft({ len, s: 1.35 })}</g>
    ${spark(hx, hy, d / 9, 34)}${burst(hx, hy, d / 8, 40, 8)}`;
}
// a lightning bolt between two points (jagged, re-drawn every 2 frames)
function bolt(f, x0, y0, x1, y1, w = 1, seed = 0) {
  const k = Math.floor(f / 2) + seed, N = 9;
  let d = `M${x0},${y0}`;
  for (let i = 1; i < N; i++) { const t = i / N, j = (S.rnd(k * 13 + i) - 0.5) * 90 * w; d += ` L${(lerp(x0, x1, t) + j).toFixed(1)},${lerp(y0, y1, t).toFixed(1)}`; }
  d += ` L${x1},${y1}`;
  return `<path d="${d}" fill="none" stroke="#ffe680" stroke-width="${30 * w}" stroke-linejoin="round" opacity="0.45" filter="url(#soft)"/>
    <path d="${d}" fill="none" stroke="${INK}" stroke-width="${17 * w}" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="${d}" fill="none" stroke="#fff6c0" stroke-width="${9 * w}" stroke-linejoin="round" stroke-linecap="round"/>`;
}

// ---------- shots ----------
const SHOTS = [
  // 1 · "You sail with fifty ships of your own soldiers," – the fleet at dawn, the counter rolls up to 50
  { cue: 'You sail', draw(f, l, d) {
    const fifty = R.at('fifty');
    const c = cam(l, [[0, 900, 560, 1.06], [d, 1040, 540, 1.13]]);
    const n = Math.max(1, Math.round(lerp(1, 50, easeOut(win(f, fifty, fifty + 16)))));
    let far = '', mid = '';
    for (let i = 0; i < 13; i++) { const a = S.rnd(i + 11); far += T.ship(-60 + i * 160 + a * 70 + l * 0.5, 662 + a * 18 + Math.sin(f / 20 + i) * 2, 0.08 + a * 0.03, { sail: '#f3dcc0', emblem: true }); }
    for (let i = 0; i < 6; i++) { const a = S.rnd(i + 31); mid += T.ship(-120 + i * 380 + a * 90 + l * 1.1, 800 + a * 26 + Math.sin(f / 17 + i) * 4, 0.19 + a * 0.06, { sail: '#f1e2c4', emblem: true }); }
    return { cam: c, bg: `${T.sky('dawn')}${T.sun(380, 630, 110, '#ffe2a8', '#ffd08a')}${T.cloud(300, 230, 1.1, '#fde3c2', f, 0.2, 0.7)}${T.cloud(1450, 170, 0.9, '#fde3c2', f, 0.15, 0.6)}
      ${T.seaBand(640, 460, '#5d8fae', '#ffe2b8', f, 77)}${far}${T.seaBand(745, 340, '#4f84a6', '#ffe9c8', f, 79)}${mid}${motes(f, 18, { col: '#fff1d6', seed: 81 })}`,
      fg: `${T.ship(1520 + l * 1.6, 1090 + Math.sin(f / 16) * 6, 0.62, { emblem: true })}
      ${popLabel(f, fifty, 640, 330, 124, `${n} SHIPS`, { rot: -4 })}` };
  } },
  // 2 · "the Myrmidons." – on deck: a row of identical soldiers that breathe, blink and look up in sync
  { cue: 'the Myrmidons', draw(f, l, d) {
    const my = R.at('Myrmidons');
    const c = cam(l, [[0, 880, 560, 1.04], [d, 1000, 545, 1.09]]);
    const look = f < my ? 0.75 : lerp(0.75, 0, easeOut(win(f, my, my + 4))), bl = blink(f, [my + 12]);
    let row = '';
    for (let i = 0; i < 6; i++) row += fig(230 + i * 292, 948, 0.64, K2.soldier({ side: 'greek', k: 0, look, blink: bl, breathe: bob(f) }));
    const rail = `<rect x="-100" y="830" width="2120" height="40" rx="10" fill="#8a5a36" stroke="${INK}" stroke-width="6"/>
      ${Array.from({ length: 12 }, (_, i) => `<rect x="${-40 + i * 180}" y="866" width="26" height="80" fill="#6b4226" stroke="${INK}" stroke-width="5"/>`).join('')}
      <rect x="-100" y="940" width="2120" height="200" fill="#5a3a26" stroke="${INK}" stroke-width="6"/>
      <path d="M-100,990 L2020,990 M-100,1040 L2020,1040" stroke="#3f281a" stroke-width="6"/>
      ${Array.from({ length: 10 }, (_, i) => `<circle cx="${60 + i * 200}" cy="1012" r="40" fill="${C.bronze}" stroke="${INK}" stroke-width="5"/><path d="M${36 + i * 200},1012 q8,-8 16,0 q8,8 16,0 q8,-8 16,0" fill="none" stroke="${C.teal}" stroke-width="5" stroke-linecap="round"/>`).join('')}`;
    return { cam: c, bg: `${T.sky('dawn')}${T.seaBand(600, 500, '#5d8fae', '#ffe2b8', f, 71)}
      <path d="M1500,-40 L1500,860" stroke="${INK}" stroke-width="30"/><path d="M1500,-40 L1500,860" stroke="${C.wood}" stroke-width="20"/>
      <path d="M1180,-60 Q1500,-100 1820,-60 L1800,330 Q1500,300 1200,330 Z" fill="#efe2c4" stroke="${INK}" stroke-width="7"/>
      <path d="M1400,140 q25,-30 50,0 q25,30 50,0 q25,-30 50,0 q25,30 50,0" fill="none" stroke="${C.teal}" stroke-width="16" stroke-linecap="round"/>
      <path d="M1500,0 L-60,700 M1500,0 L2000,640" stroke="#4a3a2a" stroke-width="5" opacity="0.7"/>${motes(f, 16, { col: '#fff1d6', seed: 83 })}`,
      fg: row + rail + popLabel(f, my, 740, 270, 100, 'MYRMIDONS', { sub: '(yours)', rot: -3 }) };
  } },
  // 3 · "The whole Greek fleet sets off for Troy," – the map: GREECE ··· TROY, the route draws towards Troy
  { cue: 'The whole Greek', draw(f, l, d) {
    const c = cam(l, [[0, 960, 540, 1.0], [d, 1020, 520, 1.08]]);
    const t = 0.55 * win(l, 4, d + 1);
    return { cam: c, bg: woodTable(f, { gx: 1100, gy: 380 }) + `<g transform="${MAPT}">${PR.mapGreece()}${PR.mapRoute({ wrong: true, t, ship: true })}</g>`,
      fg: `${fig(170, 1010, 1.4, PR.candle({ f }))}${motes(f, 12, { col: '#ffe9c0', seed: 97 })}` };
  } },
  // 4 · "and lands in the wrong country." – the route swerves down, stops, a red X, WRONG COUNTRY
  { cue: 'and lands', draw(f, l, d) {
    const wr = R.at('wrong');
    const c = cam(l, [[0, 1185, 450, 1.72], [d, 1215, 470, 1.8]]);
    const t = lerp(0.55, 1, ease(win(f, f - l, wr - 3)));
    const [mx, my] = mapXY(PR.MAP.mysia);
    return { cam: c, bg: woodTable(f, { gx: 1300, gy: 500, glow: '#ff9a70', go: 0.16 }) + `<g transform="${MAPT}">${PR.mapGreece()}${PR.mapRoute({ wrong: true, t, ship: true })}

  } },
  // 18 · "Well, almost nothing." – close on your bare heel; one arrow lands right next to it: (almost)
  { cue: 'Well, almost', draw(f, l, d) {
    const al = R.at('almost'), hit = al - 3;
    const c = cam(l, [[0, 950, 640, 1.08], [d, 1000, 680, 1.18]]);
    const fl = easeOut(win(f, hit - 4, hit)), wob = f >= hit ? Math.sin((f - hit) * 1.6) * 9 * Math.exp(-(f - hit) / 8) : 0;
    const ax = lerp(1700, 1160, fl), ay = lerp(380, 968, fl);
    return { cam: c, bg: `${T.sky('troy')}${T.sun(420, 700, 120, '#ffb26b', '#ff8a50')}<path d="M-100,760 Q600,730 1300,770 Q1700,790 2020,760 L2020,1100 L-100,1100 Z" fill="#4a2e2a"/>
      <rect x="-200" y="-200" width="2320" height="1480" fill="#2a0e14" opacity="0.3"/>${motes(f, 18, { col: '#ffb070', seed: 121 })}`,
      fg: `<ellipse cx="900" cy="996" rx="560" ry="24" fill="#000" opacity="0.3"/>${fig(980, 990, 1.3, heelFoot())}
      ${f >= hit - 4 ? `<g transform="translate(${ax.toFixed(1)} ${ay.toFixed(1)}) rotate(${(118 + wob).toFixed(1)})">${PR.arrowShaft({ len: 320 })}</g>` : ''}
      ${f >= hit ? `<path d="M1110,986 Q1160,952 1214,986 Z" fill="#3a2422" stroke="${INK}" stroke-width="4"/>${burst(1160, 975, (f - hit) / 10, 40, 7, '#e8c9a0')}` : ''}
      ${popLabel(f, al + 6, 1420, 340, 78, '(almost)', { font: ITAL, rot: -3 })}
      ${arrow(f, al + 10, 'M1360,380 Q1250,560 1090,800', 480, 'M1108,770 L1088,804 L1126,800')}` };
  } },
  // 19 · "They start calling you swift-footed Achilles." – the soldiers cheer, the banner unrolls, you zip past
  { cue: 'They start calling', draw(f, l, d) {
    const sf = R.at('swift-footed'), rs = sf - 6;
    const c = cam(l, [[0, 960, 560, 1.04], [d, 990, 540, 1.09]]);
    const rx = lerp(-420, 2380, win(f, rs, rs + 16));
    const men = [[190, 1030, 1], [420, 1060, 2], [1500, 1060, 1], [1730, 1030, 2]];
    let crowd = '';
    men.forEach(([x, y, k], i) => { const lk = clamp((rx - x) / 500, -1, 1), hop = Math.abs(Math.sin((f + i * 5) / 5)) * -14;
      crowd += fig(x, y + hop, 0.6, K2.soldier({ side: 'greek', k, arms: 'cheer', expr: 'happy', shieldOn: false, spear: false, look: lk, breathe: bob(f, i) })); });
    let dust = '';
    for (let k = 0; k < 9; k++) { const tk = rs + k * 2, x = lerp(-420, 2380, win(tk, rs, rs + 16)), t = (f - tk) / 34;
      if (t > 0 && t < 1 && x > -100 && x < 2000) dust += `<g transform="translate(${(x - 60).toFixed(0)} 950)">${PR.dustCloud({ t, w: 220, r: 46, col: '#e8d2a8', seed: k * 5 })}</g>`; }
    const lines = f >= rs && f < rs + 18 ? `<g transform="translate(${(rx - 560).toFixed(0)} 560)">${PR.speedLines({ w: 480, h: 360, n: 8, f })}</g>` : '';
    return { cam: c, bg: T.camp(f, { time: 'day' }),
      fg: `${dust}${lines}${f >= rs && f < rs + 17 ? fig(rx, 950, 0.8, K2.achilles({ pose: 'run', expr: 'determined' })) : ''}${crowd}
      <g transform="translate(960 250)">${PR.banner({ text: 'SWIFT-FOOTED ACHILLES', u: win(f, sf, sf + 12), w: 1180, h: 140 })}</g>` };
  } },
  // 20 · "Your boss is Agamemnon, king of all the Greeks." – on his throne, huge crown, huge plate; the soldiers bow
  { cue: 'Your boss', draw(f, l, d) {
    const ag = R.at('Agamemnon'), kg = R.at('king');
    const c = cam(l, [[0, 960, 560, 1.02], [d, 960, 500, 1.12]]);
    const bw = 20 * easeOut(win(f, kg, kg + 8));
    const drape = sd => `<path d="M${960 + sd * 1100},-40 L${960 + sd * 180},-40 Q${960 + sd * 420},260 ${960 + sd * 1100},${560}" fill="#a3202f" stroke="${INK}" stroke-width="6"/>
      <path d="M${960 + sd * 180},-40 Q${960 + sd * 420},260 ${960 + sd * 1100},${560}" fill="none" stroke="#e2b04e" stroke-width="12"/>`;
    return { cam: c, bg: T.tentInside(f, { night: false }) + `<rect x="-200" y="-200" width="2320" height="1480" fill="#3a1418" opacity="0.25"/>${drape(-1)}${drape(1)}`,
      fg: `${T.shadow(960, 960, 220)}${fig(960, 962, 1.1, PR.throne())}
      ${fig(960, 962 - 70, 1.1, K2.agamemnon({ pose: 'sit', arms: 'plate', expr: 'smug', breathe: bob(f), blink: blink(f, [ag + 16]) }))}
      ${spark(1008, 296, win(f, kg + 2, kg + 18), 42)}
      ${fig(290, 1010, 0.62, K2.soldier({ side: 'greek', k: 1, expr: 'stern', breathe: bob(f, 2) }), bw)}
      ${fig(1630, 1010, 0.62, K2.soldier({ side: 'greek', k: 2, expr: 'stern', breathe: bob(f, 3) }), -bw)}
      ${popLabel(f, ag, 500, 300, 84, 'AGAMEMNON', { sub: '(the boss)', rot: -3 })}` };
  } },
  // 21 · "He's never at the front, and" – the battle far away on the plain; he sits under a parasol with grapes
  { cue: "He's never", draw(f, l, d) {
    const fr = R.at('front');
    const c = cam(l, [[0, 1150, 540, 1.22], [d, 880, 545, 1.25]]);
    return { cam: c, bg: `${T.meadow(f, { time: 'gold' })}<g transform="translate(-540 30)">${T.troySkyline(560, 0.26, '#b39a80')}</g>
      ${T.smoke(f, 380, 660, 0.5, '#8a7a72', 2, 0.5)}<g transform="translate(420 680) scale(0.26)">${PR.fightCloud({ R: 260, f, sleeves: [C.teal, '#7a2e2e', '#6f7f3a'] })}</g>
      <path d="M980,1100 Q1150,830 1500,812 Q1800,800 2020,840 L2020,1100 Z" fill="#9aa04a" stroke="${INK}" stroke-width="5"/>`,
      fg: `${T.shadow(1450, 840, 120)}${fig(1450, 842, 0.8, PR.stool())}${fig(1450, 842, 0.8, K2.agamemnon({ pose: 'sit', arms: 'grapes', expr: 'happy', breathe: bob(f) }))}
      ${fig(1620, 842, 0.9, PR.parasol({ h: 520 }))}
      ${popLabel(f, fr, 560, 330, 78, 'THE FRONT', { sub: '(far away)', rot: -3 })}
      ${arrow(f, fr + 4, 'M500,400 Q440,520 430,610', 230, 'M410,585 L430,614 L452,588')}` };
  } },
  // 22 · "he always takes the biggest share." – a huge pile HIS SHARE, a tiny one EVERYONE ELSE
  { cue: 'takes the biggest', draw(f, l, d) {
    const a = f - l, bg2 = R.at('biggest');
    const c = cam(l, [[0, 940, 560, 1.03], [d, 985, 560, 1.09]]);
    return { cam: c, bg: T.gagBg(f, 'violet', '#fbe3ff', 960, 1000) + `<rect x="-200" y="920" width="2320" height="300" fill="#2a1d3a" opacity="0.55"/>`,
      fg: `${fig(660, 900, 0.82, K2.agamemnon({ arms: 'out', expr: 'smug', breathe: bob(f), blink: blink(f, [a + 20]) }))}
      ${T.shadow(660, 932, 340)}${fig(660, 935, 1.3, PR.lootPile({ big: true }))}
      ${T.shadow(1330, 932, 60)}${fig(1330, 935, 1.15, PR.lootPile({ big: false }))}
      ${T.shadow(1560, 930, 90)}${fig(1560, 930, 0.62, K2.soldier({ side: 'greek', k: 1, expr: 'sad', look: -0.7, shieldOn: false, breathe: bob(f, 4) }))}
      ${popLabel(f, a + 6, 660, 270, 92, 'HIS SHARE', { fill: '#f6d35b', rot: -4 })}
      ${popLabel(f, bg2 + 4, 1300, 640, 56, 'EVERYONE ELSE', { rot: 3 })}
      ${arrow(f, bg2 + 8, 'M1310,670 Q1290,790 1322,860', 200, 'M1300,836 L1322,866 L1344,838')}` };
  } },
  // 23 · "He's the king." – close on the crown, a glint runs across it
  { cue: "He's the king", draw(f, l, d) {
    const kg = R.at('king', 2);
    const c = cam(l, [[0, 960, 540, 1.0], [d, 960, 490, 1.1]]);
    const g = win(f, kg - 4, kg + 10);
    return { cam: c, bg: `<rect x="-200" y="-200" width="2320" height="1480" fill="url(#drape)"/>${T.rays(f, 960, 380, 18, '#ffd27a', 0.1, 0.003)}
      ${Array.from({ length: 9 }, (_, i) => `<path d="M${-60 + i * 250},-40 Q${30 + i * 250},540 ${-60 + i * 250},1120" fill="none" stroke="#5a0f18" stroke-width="16" opacity="0.5"/>`).join('')}${motes(f, 14, { col: '#ffe7a8', seed: 131 })}`,
      fg: `${fig(960, 1560, 2.0, K2.agamemnon({ arms: 'goblet', expr: 'smug', breathe: bob(f), blink: blink(f, [kg + 14]) }))}
      ${g > 0 && g < 1 ? `<path d="M${(lerp(780, 1140, g)).toFixed(0)},250 l40,0 l-60,200 l-40,0 Z" fill="#fffbe0" opacity="${(0.7 * Math.sin(g * Math.PI)).toFixed(2)}"/>` : ''}
      ${spark(1024, 270, win(f, kg + 4, kg + 20), 50)}${spark(892, 300, win(f, kg - 2, kg + 12), 30)}` };
  } },
  // 24 · "But you're the best of the Greeks." – you, proud, on red-gold rays
  { cue: "But you're the best", draw(f, l, d) {
    const bs = R.at('best');
    const c = cam(l, [[0, 960, 600, 1.04], [d, 960, 540, 1.12]]);
    return { cam: c, bg: T.gagBg(f, 'heroic', '#ffe7a8', 960, 560),
      fg: `${T.shadow(960, 1060, 160, 0.3)}${fig(960, 1062, 1.22, K.hero({ expr: 'proud', breathe: bob(f), blink: blink(f, [bs + 18]) }))}
      ${spark(1094, 220, win(f, bs, bs + 16), 48)}` };
  } },
  // 25 · "That's a problem." – split screen face-off, lightning between you
  { cue: "That's a problem", draw(f, l, d) {
    const pb = R.at('problem'), th = R.at("That's");
    const c = cam(l, [[0, 960, 540, 1.0], [d, 960, 520, 1.08]]);
    const sh = f >= pb && f < pb + 10 ? Math.sin((f - pb) * 2.6) * 10 * (1 - (f - pb) / 10) : 0;
    const strikeW = f >= pb ? 1.6 - 0.6 * win(f, pb, pb + 12) : 0.7 + 0.15 * Math.sin(f * 1.3);
    const flash = f >= pb ? 1 - win(f, pb, pb + 6) : 0;
    const look = f < th + 4 ? 0 : 0.9;
    return { cam: `translate(${sh.toFixed(1)} 0) ${c}`, defs: `<clipPath id="fL"><path d="M-200,-200 L1010,-200 L930,1280 L-200,1280 Z"/></clipPath><clipPath id="fR"><path d="M1010,-200 L2120,-200 L2120,1280 L930,1280 Z"/></clipPath>`,
      bg: `<g clip-path="url(#fL)"><rect x="-200" y="-200" width="2320" height="1480" fill="url(#heroic)"/>${T.rays(f, 470, 560, 16, '#ffb070', 0.14)}
          ${fig(500, 1520, 2.0, K2.agamemnon({ arms: 'down', expr: 'angry', look, breathe: bob(f), blink: blink(f, [pb + 20]) }))}</g>
        <g clip-path="url(#fR)"><rect x="-200" y="-200" width="2320" height="1480" fill="url(#tealR)"/>${T.rays(f, 1450, 560, 16, '#bfeff0', 0.14)}
          ${fig(1440, 1500, 2.0, K2.achilles({ arms: 'down', expr: 'angry', look: -look, shieldOn: false, cape: false, breathe: bob(f, 2), blink: blink(f, [pb + 26]) }))}</g>`,
      fg: bolt(f, 1012, -60, 928, 1140, strikeW),
      hud: flash > 0 ? `<rect width="1920" height="1080" fill="#fffbe6" opacity="${(0.6 * flash).toFixed(2)}"/>` : '' };
  } },
];

const R = RUN({ TEXT, OFF: 1.6, card: ['II', 'Fifty Ships'], tail: 1.3, SHOTS,
  defs: () => `<radialGradient id="tealR" cx="0.75" cy="0.5" r="0.75"><stop offset="0" stop-color="#7fd0d2"/><stop offset="0.45" stop-color="#2f7f88"/><stop offset="1" stop-color="#123a40"/></radialGradient>
    <linearGradient id="drape" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4a0c14"/><stop offset="0.5" stop-color="#a3202f"/><stop offset="1" stop-color="#4a0c14"/></linearGradient>` });
</script>
</body>
</html>
