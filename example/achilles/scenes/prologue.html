<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Achilles – piece: prologue "Half a God"</title>
<style>html, body { margin: 0; padding: 0; background: #000; overflow: hidden; } #stage { width: 1920px; height: 1080px; } svg { display: block; }</style>
</head>
<body>
<div id="stage"></div>
<script src="../lib/cast.js"></script>
<script src="../lib/cast2.js"></script>
<script src="../lib/props.js"></script>
<script src="../lib/scene.js"></script>
<script src="../lib/sets.js"></script>
<script src="../lib/runner.js"></script>
<script>
// The prologue "Half a God" (EPISODE.md § 2): birth to adulthood, the fastest and funniest part of the episode.
// No chapter card: it flows straight on from the hook (same river, same moon, Thetis on her rock, the baby still screaming).
// Every cut and every pop hangs on the narrator's words (?words=../voice/prologue/words.json).
const K = window.CAST, K2 = window.CAST2, PR = window.PROPS, S = window.SCENE, T = window.SETS;
const { C, INK, cel, limb } = K;
const { ease, easeOut, win, lerp, popLabel, arrow, strike, stamp, motes, blink, clamp } = S;
const TEXT = `Your mom is Thetis, a sea goddess, and she wants you immortal. Hence the river. Your dad is Peleus, a mortal king, who was not consulted. Everything goes under, except the heel in her hand. Tiny detail. Then she tries a second trick, at night, holding you in the fire. Your dad walks in and screams. Your mom walks back into the sea. And that's your parents' marriage. Oh, and at their wedding, the one goddess nobody invited, Strife, rolled in a golden apple that says, for the fairest. Three goddesses are still fighting over it. Remember that apple. So your dad hands you to Chiron, a centaur. Half horse, half the best teacher in Greece. Breakfast is lion guts and bear marrow. At six, you drag home dead lions and wild boars, and you run down deer without dogs. Chiron teaches you to fight, to heal, and to play the lyre. The lyre, you think, is useless. Hold that thought. Back home, a new boy moves in. Patroclus. He killed another kid over a game of dice. Your dad's reaction? Perfect. New best friend. He's a year older, and the only one who can calm you down. In the hall hangs your dad's armor, a wedding gift from the gods. Remember that armor. And your mom? She knows exactly how your life ends. She just isn't saying. Then you grow up. Fast. Blond, proud, the fastest man in Greece. And still screaming for attention.`;

// ---------- small helpers ----------
const n1 = v => Math.round(v * 10) / 10;
const bob = (f, k = 0) => Math.sin((f + k * 13) / 14) * 3.5;
const ink = (w = 4) => `stroke="${INK}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;
const G = (x, y, s, svg, rot = 0) => `<g transform="translate(${n1(x)} ${n1(y)})${rot ? ` rotate(${n1(rot)})` : ''}${s !== 1 ? ` scale(${s})` : ''}">${svg}</g>`;
const mirror = svg => `<g transform="translate(1920 0) scale(-1 1)">${svg}</g>`;
const sepia = svg => `<g filter="url(#sepiaF)">${svg}</g>`;
const kidA = o => K2.kid({ who: 'achilles', age: 'six', ...o });          // age 'six' = the kid from cast.js, with every expression
const kidP = o => K2.kid({ who: 'patroclus', expr: 'calm', ...o });
const ITAL = `font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-style="italic"`;
// where a stage point lands on the screen for a given camera transform (labels and arrows live on the screen, in the hud)
function camPt(cam, X, Y) {
  const m = /scale\(([-\d.]+)\) translate\(([-\d.]+) ([-\d.]+)\)/.exec(cam);
  const z = +m[1], x = -m[2], y = -m[3];
  return [960 + z * (X - x), 540 + z * (Y - y)];
}
// a camera without the runner's amplification (for the fast zoom), clamped inside the stage
function camAt(z, x, y) {
  const hx = 960 / z, hy = 540 / z;
  return `translate(960 540) scale(${z.toFixed(4)}) translate(${(-clamp(x, hx, 1920 - hx)).toFixed(2)} ${(-clamp(y, hy, 1080 - hy)).toFixed(2)})`;
}
// a hand-drawn arrow from (x1,y1) to (x2,y2) (screen), bowed sideways, drawing on in 10 frames
function arrowTo(f, f0, x1, y1, x2, y2, bend = 0.25, o = {}) {
  const dx = x2 - x1, dy = y2 - y1, cx = (x1 + x2) / 2 - dy * bend, cy = (y1 + y2) / 2 + dx * bend;
  let len = 0, px = x1, py = y1;
  for (let i = 1; i <= 16; i++) { const t = i / 16, qx = (1 - t) * (1 - t) * x1 + 2 * t * (1 - t) * cx + t * t * x2, qy = (1 - t) * (1 - t) * y1 + 2 * t * (1 - t) * cy + t * t * y2; len += Math.hypot(qx - px, qy - py); px = qx; py = qy; }
  const tx = x2 - cx, ty = y2 - cy, tl = Math.hypot(tx, ty) || 1, ux = tx / tl, uy = ty / tl, h = o.head || 24;
  const a = [x2 - ux * h - uy * h * 0.75, y2 - uy * h + ux * h * 0.75], b = [x2 - ux * h + uy * h * 0.75, y2 - uy * h - ux * h * 0.75];
  return arrow(f, f0, `M${n1(x1)},${n1(y1)} Q${n1(cx)},${n1(cy)} ${n1(x2)},${n1(y2)}`, Math.ceil(len) + 2, `M${n1(a[0])},${n1(a[1])} L${n1(x2)},${n1(y2)} L${n1(b[0])},${n1(b[1])}`, o);
}
// any svg that pops like a label (3 frames up with overshoot)
const popG = (f, f0, x, y, svg, rot = 0) => { const s = S.popScale(f - f0); return s <= 0 ? '' : `<g transform="translate(${n1(x)} ${n1(y)}) rotate(${rot}) scale(${s.toFixed(3)})">${svg}</g>`; };
const star4 = (x, y, z, col = '#fffbe6', op = 1, outline = false) => z <= 0.5 ? '' : `<path d="M${n1(x)},${n1(y - z)} L${n1(x + z * 0.24)},${n1(y - z * 0.24)} L${n1(x + z)},${n1(y)} L${n1(x + z * 0.24)},${n1(y + z * 0.24)} L${n1(x)},${n1(y + z)} L${n1(x - z * 0.24)},${n1(y + z * 0.24)} L${n1(x - z)},${n1(y)} L${n1(x - z * 0.24)},${n1(y - z * 0.24)} Z" fill="${col}" opacity="${op}"${outline ? ` ${ink(3)}` : ''}/>`;
// white shake lines over a head (screams, the hook's LOUD)
const shakeLines = (x, y, r, k = 0) => [0, 1, 2, 3, 4, 5].map(i => { const a = -2.6 + i * 0.4 + Math.sin(k * 1.7 + i) * 0.05, c = Math.cos(a), s = Math.sin(a);
  const d = `M${n1(x + c * r)},${n1(y + s * r)} l${n1(c * r * 0.34)},${n1(s * r * 0.34)}`;
  return `<path d="${d}" stroke="${INK}" stroke-width="${n1(r * 0.06 + 9)}" stroke-linecap="round" opacity="0.5"/><path d="${d}" stroke="#fff" stroke-width="${n1(r * 0.06 + 3)}" stroke-linecap="round"/>`; }).join('');
const flash = (f, f0, k = 4, col = '#fff') => f >= f0 && f < f0 + k ? `<rect width="1920" height="1080" fill="${col}" opacity="${(0.85 * (1 - (f - f0) / k)).toFixed(2)}"/>` : '';
const shadow = (x, y, w, op) => T.shadow(x, y, w, op);

// Thetis with the arm poses the scenes need – the same drawing as cast.js thetis() (copied here, our helper), with head2 faces.
// arms 'down' (cast.js: one relaxed, one palm raised) | 'holdOut' (the hand is drawn by the scene, at the baby's foot) |
// 'carry' (cradles o.baby, drawn in her coordinates) | 'shh' (finger on the lips, the other arm behind her back); back: seen from behind
function thetis2(o = {}) {
  const r = 80, b = o.breathe || 0, arms = o.arms || 'down';
  const L = (x1, y1, x2, y2, w) => limb(x1, y1 + b, x2, y2 + b, w, C.skin, C.skinS);
  const hairBack = a => `<path d="M-60,${-500 + b} C-128,-470 -150,-380 -132,-300 C-120,-250 -146,-220 -134,-180
    q-6,26 16,30 q20,4 22,-16 q14,22 34,10 q14,-10 6,-28 L74,-196 q-8,18 6,28 q20,12 34,-10 q2,20 22,16 q22,-4 16,-30
    C146,-220 120,-250 132,-300 C150,-380 128,-470 60,${-500 + b} Z" ${a}/>`;
  const strands = `<path d="M-108,-420 C-124,-360 -110,-300 -118,-240 M110,-420 C124,-360 110,-300 118,-240" fill="none" stroke="${C.seaL}" stroke-width="6" stroke-linecap="round" opacity="0.8"/>`;
  let s = '';
  if (!o.back) s += cel(hairBack, C.sea, C.seaS, 0.08, 0, 140) + strands;
  if (arms === 'shh') s += L(-46, -360, -82, -292, 22) + L(-82, -292, -44, -238, 20);       // the left hand hides behind her back
  const gown = a => `<path d="M-46,${-372 + b} Q0,${-382 + b} 46,${-372 + b} C60,-270 96,-130 120,-34 Q100,-14 80,-30 Q60,-12 40,-28 Q20,-10 0,-26 Q-20,-10 -40,-28 Q-60,-12 -80,-30 Q-100,-14 -120,-34 C-96,-130 -60,-270 -46,${-372 + b} Z" ${a}/>`;
  s += cel(gown, C.gown, C.gownS, -0.16, 0, 120);
  s += `<path d="M-20,-300 Q-34,-170 -56,-50 M18,-300 Q30,-170 50,-48" fill="none" stroke="${C.gownS}" stroke-width="4" stroke-linecap="round"/>`;
  for (let i = -3; i <= 3; i++) s += `<path d="M${i * 38 - 18},-14 q9,-16 20,-4 q8,-12 18,0" fill="${C.foam}" ${ink(2.8)}/>`;
  s += `<path d="M-48,${-318 + b} Q0,${-306 + b} 48,${-318 + b}" fill="none" stroke="${C.seaS}" stroke-width="10" stroke-linecap="round"/>`;
  if (o.back) s += cel(hairBack, C.sea, C.seaS, 0.08, 0, 140) + strands;                        // from behind, the long hair falls over her back
  if (arms === 'down' || arms === 'holdOut') s += L(-46, -360, -70, -282, 22) + L(-70, -282, -60, -212, 20) + K.hand(-58, -204 + b, 13);
  if (arms === 'down') s += L(46, -360, 84, -300, 22) + L(84, -300, 112, -350, 20) + K.hand(115, -358 + b, 14);
  if (arms === 'holdOut') s += L(46, -360, 118, -318, 22) + L(118, -318, 170, -262, 20);
  if (arms === 'pinch') s += L(-46, -360, -92, -300, 22) + L(-92, -300, -44, -296, 20) + (o.held || '') + K.hand(-44, -296 + b, 14)
    + L(46, -360, 92, -300, 22) + L(92, -300, 44, -296, 20) + K.hand(44, -296 + b, 14);
  if (arms === 'carry') s += (o.baby || '') + L(-46, -360, -82, -300, 22) + L(-82, -300, 18, -262, 20) + K.hand(22, -262 + b, 13)
    + L(46, -360, 82, -300, 22) + L(82, -300, -16, -278, 20) + K.hand(-20, -278 + b, 13);
  s += `<rect x="-15" y="${-398 + b}" width="30" height="30" fill="${C.skinS}" ${ink()}/>`;
  if (o.back) {
    const back = cel(a => `<circle r="${r * 1.04}" ${a}/>`, C.sea, C.seaS, 0.1, -0.05, r)
      + `<path d="M${-0.5 * r},${-0.72 * r} Q${-0.62 * r},0 ${-0.46 * r},${0.82 * r} M0,${-0.98 * r} Q${0.06 * r},0 0,${0.98 * r} M${0.5 * r},${-0.72 * r} Q${0.64 * r},0 ${0.46 * r},${0.82 * r}" fill="none" stroke="${C.seaL}" stroke-width="6" stroke-linecap="round" opacity="0.8"/>`;
    s += `<g transform="translate(0 ${-452 + b})">${back}</g>`;
  } else {
    const lock = sd => {
      const x = v => n1(sd * v * r), y = v => n1(v * r);
      return `<path d="M${x(0.02)},${y(-1.18)} C${x(0.62)},${y(-1.22)} ${x(1.16)},${y(-0.8)} ${x(1.1)},${y(0.0)}
        C${x(1.08)},${y(0.4)} ${x(1.02)},${y(0.64)} ${x(0.86)},${y(0.74)} q${x(-0.16)},${y(0.04)} ${x(-0.14)},${y(-0.12)} q${x(0.06)},${y(-0.08)} ${x(0.12)},${y(-0.02)}
        C${x(0.86)},${y(0.24)} ${x(0.9)},${y(-0.12)} ${x(0.78)},${y(-0.36)} C${x(0.62)},${y(-0.3)} ${x(0.46)},${y(-0.36)} ${x(0.36)},${y(-0.5)}
        C${x(0.26)},${y(-0.44)} ${x(0.12)},${y(-0.5)} ${x(0.04)},${y(-0.66)} Z" fill="${sd < 0 ? C.sea : C.seaS}" ${ink()}/>
        <path d="M${x(0.3)},${y(-1.08)} Q${x(0.82)},${y(-0.9)} ${x(0.96)},${y(-0.2)}" fill="none" stroke="${C.seaL}" stroke-width="5" stroke-linecap="round" opacity="0.85"/>`;
    };
    const pearls = [-0.56, -0.28, 0, 0.28, 0.56].map(t => `<circle cx="${n1(t * r)}" cy="${n1((-0.84 - 0.22 * (1 - Math.abs(t) * 1.3)) * r)}" r="${n1(0.06 * r)}" fill="${C.white}" ${ink(2.5)}/>`).join('');
    s += `<g transform="translate(0 ${-452 + b})">${K2.head2(r, { expr: 'calm', ...o, back: '', ears: false, front: lock(-1) + lock(1) + pearls })}</g>`;
  }
  if (arms === 'shh') s += L(46, -360, 72, -318, 22) + L(72, -318, 24, -394, 20)
    + `<path d="M14,${-402 + b} L12,${-450 + b}" stroke="${INK}" stroke-width="20" stroke-linecap="round"/><path d="M14,${-402 + b} L12,${-450 + b}" stroke="${C.skin}" stroke-width="12" stroke-linecap="round"/>`
    + K.hand(24, -394 + b, 15);
  return s;
}
// the forearm of Thetis coming in from above the frame, her hand round the baby's ankle (foot at x,y; s = scale of the baby)
function armFromTop(x, y, s = 1) {
  const x0 = x + 150 * s, x1 = x + 26 * s, y1 = y + 30 * s;
  return `<path d="M${n1(x0)},-320 L${n1(x1)},${n1(y1)}" stroke="${INK}" stroke-width="${n1(44 * s)}" stroke-linecap="round"/>
    <path d="M${n1(x0)},-320 L${n1(x1)},${n1(y1)}" stroke="${C.skin}" stroke-width="${n1(36 * s)}" stroke-linecap="round"/>
    ${K.hand(x + 6 * s, y + 36 * s, n1(24 * s))}<path d="M${n1(x - 12 * s)},${n1(y + 32 * s)} q${n1(8 * s)},${n1(10 * s)} ${n1(20 * s)},${n1(8 * s)}" fill="none" stroke="${INK}" stroke-width="3.5" stroke-linecap="round"/>`;
}
// the baby on Thetis' outstretched hand (hook shot 9): hand at (hx, hy)
const babyOnHand = (hx, hy, s, o = {}) => `<g transform="translate(${n1(hx)} ${n1(hy)}) rotate(${n1(o.sway || 0)}) scale(${0.55 * s})">${K.babyHang({ expr: 'neutral', ...o })}</g>${K.hand(hx + 2 * s, hy + 18 * s, n1(14 * s))}`;
// Peleus holding the baby against his chest (his hands drawn again over the baby)
function peleusBaby(o = {}) {
  const b = o.breathe || 0;
  return K2.peleus({ arms: 'hold', ...o }) + G(0, -246 + b, 0.42, K.babyAchilles({ expr: o.babyExpr || 'neutral', blink: o.babyBlink || 0 }))
    + K.hand(-40, -266 + b, 15) + K.hand(40, -266 + b, 15);
}
// Peleus' nightcap (worn on a head of radius r)
const nightcap = r => `<path d="M${n1(-1.0 * r)},${n1(-0.38 * r)} C${n1(-0.92 * r)},${n1(-1.35 * r)} ${n1(0.3 * r)},${n1(-1.56 * r)} ${n1(1.22 * r)},${n1(-1.0 * r)} Q${n1(1.5 * r)},${n1(-0.78 * r)} ${n1(1.42 * r)},${n1(-0.42 * r)} Q${n1(1.22 * r)},${n1(-0.74 * r)} ${n1(0.98 * r)},${n1(-0.44 * r)} Q0,${n1(-0.66 * r)} ${n1(-1.0 * r)},${n1(-0.38 * r)} Z" fill="#dcd2ec" ${ink()}/>
  <path d="M${n1(-0.4 * r)},${n1(-1.1 * r)} Q${n1(0.2 * r)},${n1(-1.3 * r)} ${n1(0.8 * r)},${n1(-1.12 * r)}" fill="none" stroke="#b7a8d0" stroke-width="7" stroke-linecap="round"/>
  <path d="M${n1(-1.02 * r)},${n1(-0.4 * r)} Q0,${n1(-0.7 * r)} ${n1(1.0 * r)},${n1(-0.46 * r)}" fill="none" stroke="#b7a8d0" stroke-width="10" stroke-linecap="round"/>
  <circle cx="${n1(1.44 * r)}" cy="${n1(-0.36 * r)}" r="${n1(0.17 * r)}" fill="#fffaf0" ${ink()}/>`;

// ---------- small sets ----------
function moonWater(f, water) {
  // the moon high up and its broken reflection on the river (the wide river shots)
  let refl = '';
  for (let i = 0; i < 7; i++) { const w = 60 + 30 * Math.sin(f / 9 + i * 1.3); refl += `<rect x="${n1(1460 - w / 2 + Math.sin(f / 11 + i) * 10)}" y="${water + 14 + i * 26}" width="${n1(w)}" height="7" rx="3" fill="#cfe0f2" opacity="${(0.45 - i * 0.05).toFixed(2)}"/>`; }
  return `${T.stars(f, 30, water - 100, 140)}${T.moon(1460, 190, 60)}${refl}`;
}
function hall(f, o = {}) {
  // a dark night wall of the palace (stone blocks), for the hearth and the door
  let blocks = '';
  for (let r = 0; r < 8; r++) for (let k = 0; k < 10; k++) blocks += `<rect x="${k * 220 - (r % 2) * 110 - 60}" y="${r * 112}" width="216" height="108" rx="6" fill="#2c2433" stroke="#1a1520" stroke-width="5"/>`;
  return `${T.sky('hallNight')}${blocks}<rect y="900" width="1920" height="300" fill="#2a2030"/><rect y="900" width="1920" height="10" fill="#000" opacity="0.3"/>
    ${motes(f, 14, { col: '#c9d4ff', seed: o.seed || 17 })}`;
}
function caveIn(f) {
  // inside Chiron's cave: rock walls, a fire in the back, herbs drying under the ceiling
  let rocks = '';
  for (let i = 0; i < 10; i++) { const a = S.rnd(i + 130), b = S.rnd(i + 170); rocks += `<ellipse cx="${n1(a * 1920)}" cy="${n1(150 + b * 520)}" rx="${n1(150 + a * 120)}" ry="${n1(70 + b * 60)}" fill="#4a3226" opacity="0.55"/>`; }
  let herbs = '';
  for (let i = 0; i < 6; i++) { const x = 980 + i * 120, y = 120 + (i % 2) * 30; herbs += `<path d="M${x},40 L${x},${y}" stroke="${INK}" stroke-width="3"/>${[0, 1, 2].map(k => `<ellipse cx="${x + (k - 1) * 12}" cy="${y + 18 + k * 6}" rx="8" ry="22" fill="${['#7a9a46', '#5a7030', '#8cb14a'][k]}" ${ink(2.5)} transform="rotate(${(k - 1) * 20} ${x + (k - 1) * 12} ${y + 18 + k * 6})"/>`).join('')}`; }
  return `${T.sky('caveIn')}${rocks}<circle cx="260" cy="700" r="460" fill="url(#fireGlow)"/>${T.flame(f, 260, 880, 0.75, 2)}
    <path d="M-100,0 Q300,170 760,96 Q1200,30 1520,150 Q1800,230 2020,90 L2020,-100 L-100,-100 Z" fill="#1c120d" ${ink(5)}/>${herbs}
    <rect y="900" width="1920" height="300" fill="#2e1f16"/>${motes(f, 16, { col: '#ffcf8a', seed: 131 })}`;
}
function stoneTable(x0, x1, y) {
  return `<rect x="${x0 + 26}" y="${y + 30}" width="${x1 - x0 - 52}" height="${1100 - y}" fill="#6c6870" ${ink(5)}/>
    <path d="M${x0 + 90},${y + 90} l40,30 l-10,40 M${x1 - 160},${y + 120} l30,40 l40,10" fill="none" stroke="#56535a" stroke-width="5" stroke-linecap="round"/>
    <rect x="${x0}" y="${y}" width="${x1 - x0}" height="40" rx="12" fill="#9a97a0" ${ink(5)}/><rect x="${x0 + 14}" y="${y + 6}" width="${x1 - x0 - 28}" height="10" rx="5" fill="#b7b4bc"/>`;
}
function garland(x0, x1, y, sag, k = 0) {
  const mx = (x0 + x1) / 2, cy = y + sag * 2, d = `M${x0},${y} Q${mx},${cy} ${x1},${y}`;
  let s = `<path d="${d}" fill="none" stroke="${INK}" stroke-width="22" stroke-linecap="round"/><path d="${d}" fill="none" stroke="#6f8f3a" stroke-width="13" stroke-linecap="round"/>`;
  for (let i = 1; i < 12; i++) { const t = i / 12, x = (1 - t) * (1 - t) * x0 + 2 * t * (1 - t) * mx + t * t * x1, yy = (1 - t) * (1 - t) * y + 2 * t * (1 - t) * cy + t * t * y;
    s += i % 2 ? `<circle cx="${n1(x)}" cy="${n1(yy + 4)}" r="13" fill="${['#f2a6b8', '#f6e27a', '#fff6e0'][(i + k) % 3]}" ${ink(3)}/>`
      : `<ellipse cx="${n1(x)}" cy="${n1(yy + 8)}" rx="18" ry="9" fill="#8cb14a" ${ink(3)} transform="rotate(${(i * 37) % 60 - 30} ${n1(x)} ${n1(yy + 8)})"/>`; }
  return s;
}
function pelion(f) {
  // the wedding on Mount Pelion: a warm sky, the mountains, pines, a grassy plateau
  return `${T.sky('warm')}${T.sun(1500, 300, 90, '#fff1c2', '#ffd08a')}${T.cloud(380, 230, 1.1, '#fff6e2', f, 0.2, 0.8)}
    <path d="M-100,660 L260,430 L520,600 L820,390 L1180,620 L1500,440 L2020,660 Z" fill="url(#mountain)"/>
    ${T.pines(120, 760, 1.0)}${T.pines(1820, 770, 1.1)}${T.pines(1660, 760, 0.8)}
    <rect y="740" width="1920" height="400" fill="url(#grass)"/><rect y="740" width="1920" height="10" fill="#000" opacity="0.12"/>
    ${motes(f, 18, { col: '#fff6dc', seed: 141 })}`;
}
function feastTable(x0, x1, y) {
  let s = '';
  for (const x of [x0 + 70, (x0 + x1) / 2, x1 - 70]) s += `<rect x="${x - 18}" y="${y + 90}" width="36" height="${1060 - y}" fill="${C.woodS}" ${ink(5)}/>`;
  s += `<rect x="${x0 - 20}" y="${y}" width="${x1 - x0 + 40}" height="28" rx="8" fill="${C.wood}" ${ink(5)}/>`;
  let sc = `M${x0 - 26},${y + 20} L${x1 + 26},${y + 20} L${x1 + 30},${y + 118}`;
  for (let x = x1 + 30; x > x0 - 30; x -= 60) sc += ` Q${x - 30},${y + 140} ${Math.max(x0 - 30, x - 60)},${y + 118}`;
  s += `<path d="${sc} Z" fill="#f4ecd8" ${ink(5)}/><path d="M${x0 - 28},${y + 96} L${x1 + 28},${y + 96}" stroke="${C.teal}" stroke-width="12"/>`;
  return s;
}

function heelClose(f, l, ax, ay) {
  let s = '';

  s += cel(a => `<path d="M${ax - 96},${ay + 30} Q${ax - 112},${ay + 400} ${ax - 132},${ay + 760} L${ax + 132},${ay + 760} Q${ax + 112},${ay + 400} ${ax + 96},${ay + 30} Z" ${a}/>`, C.skin, C.skinS, -0.14, 0, 130);
  s += `<path d="M${ax - 52},${ay + 170} Q${ax - 66},${ay + 360} ${ax - 76},${ay + 560}" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.4"/>
    <path d="M${ax + 40},${ay + 230} Q${ax + 48},${ay + 330} ${ax + 52},${ay + 420}" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.3"/>`;
  for (const [dx, dy, rr] of [[-30, 200, 10], [20, 260, 8], [-60, 320, 9], [44, 360, 11], [-14, 420, 8], [64, 470, 9], [-50, 520, 10]]) s += `<ellipse cx="${ax + dx}" cy="${ay + dy}" rx="${rr * 0.8}" ry="${rr}" fill="#c8f4ef" ${ink(2.5)}/><circle cx="${ax + dx - 2}" cy="${ay + dy - 3}" r="2.5" fill="#fff"/>`;
  // drips running down the leg and falling
  for (let k = 0; k < 6; k++) { const side = k % 2 ? 1 : -1, t = ((l * 0.03 + k / 6) % 1), x = ax + side * (100 + 18 * t) + side * 6, y = ay + 160 + t * 760;
    s += `<ellipse cx="${n1(x)}" cy="${n1(y)}" rx="9" ry="14" fill="#9fe0dc" ${ink(2.5)}/>`; }
  // the foot above: heel up to the left, toes to the right (he hangs upside down, the sole faces up)
  const foot = a => `<path d="M${ax - 92},${ay + 24} C${ax - 132},${ay - 70} ${ax - 124},${ay - 196} ${ax - 44},${ay - 214} C${ax + 40},${ay - 232} ${ax + 150},${ay - 226} ${ax + 212},${ay - 196} C${ax + 256},${ay - 172} ${ax + 254},${ay - 110} ${ax + 204},${ay - 96} C${ax + 150},${ay - 82} ${ax + 104},${ay - 40} ${ax + 92},${ay + 24} Z" ${a}/>`;
  s += cel(foot, C.skin, C.skinS, -0.1, -0.08, 160);
  for (const [dx, dy, rr] of [[214, -200, 25], [244, -168, 21], [254, -136, 18], [248, -106, 15]]) s += cel(a => `<circle cx="${ax + dx}" cy="${ay + dy}" r="${rr}" ${a}/>`, C.skin, C.skinS, -0.15, -0.15, rr);
  // the dry heel: matte, a warm light on it
  s += `<ellipse cx="${ax - 74}" cy="${ay - 130}" rx="34" ry="52" fill="#ffe7cc" opacity="0.6"/><path d="M${ax - 112},${ay - 92} Q${ax - 118},${ay - 160} ${ax - 74},${ay - 196}" fill="none" stroke="#fff2df" stroke-width="7" stroke-linecap="round" opacity="0.8"/>`;
  // her forearm from the right, the palm behind the ankle, four fingers round the front
  s += limb(ax + 1100, ay - 330, ax + 130, ay + 70, 128, C.skin, C.skinS);
  s += cel(a => `<ellipse cx="${ax + 110}" cy="${ay + 70}" rx="74" ry="88" ${a}/>`, C.skin, C.skinS, -0.1, -0.1, 80);
  [[4, 170, 40], [46, 176, 40], [88, 168, 38], [126, 150, 34]].forEach(([dy, len, w]) => {

  return s;

    for (let k = 0; k < 8; k++) { const px = -200 + k * 300; if (px > x) continue; const tt = clamp((f - z0 - (px + 300) / 2600 * 9) / 40); trail += G(px, 960, 1, PR.dustCloud({ t: 0.15 + tt * 0.85, w: 300, r: 50, col: '#eadcbf', seed: k })); }
    return { cam, bg: T.meadow(f),
      fg: `${t <= 0 ? `${shadow(560, 960, 110, 0.2)}${G(560, 960, 1, K2.achilles({ head: {}, expr: 'smirk', breathe: bob(f) }))}` : ''}${trail}
        ${t > 0 && t < 1 ? `${G(x - 620, 640, 1, PR.speedLines({ w: 560, h: 260, f, n: 7 }))}${G(x, 960, 1, K2.achilles({ pose: 'run', expr: 'determined' }))}` : ''}`,
      hud: popLabel(f, R.at('fastest'), 960, 260, 116, 'FASTEST', { rot: -4, fill: '#f6d35b' }) };
  } },
  // 46 · "And still screaming for attention." – a cliff at sunset: he screams at the sky, like the baby did. LOUD
  { cue: 'And still', draw(f, l, d) {
    const sc = R.at('screaming', 1, -3), att = R.at('attention.'), on = f >= sc, kick = f >= att && f < att + 10 ? Math.sin((f - att) * 2.2) * (1 - (f - att) / 10) * 10 : 0;
    const cam = S.camera(l, [[0, 960, 560, 1.04], [d, 960, 520, 1.14]]).replace('translate(960 540)', `translate(${n1(960 + kick)} ${n1(540 - kick * 0.6)})`);
    const ray = easeOut(win(f, sc, sc + 10)) * (1 + 0.6 * win(f, att, att + 6)), hx = 960, hy = 900 - 476 * 1.05;
    let rays = '';
    for (let i = 0; i < 18; i++) { const a0 = (i / 18) * Math.PI * 2 + l * 0.01, a1 = a0 + Math.PI / 18; rays += `<path d="M${hx},${n1(hy)} L${n1(hx + Math.cos(a0) * 2400)},${n1(hy + Math.sin(a0) * 2400)} L${n1(hx + Math.cos(a1) * 2400)},${n1(hy + Math.sin(a1) * 2400)} Z" fill="#fff6d8" opacity="${(0.2 * Math.min(1, ray)).toFixed(2)}"/>`; }
    const rings = on ? [0, 1, 2].map(k => { const t = ((f - sc) / 22 + k / 3) % 1; return G(hx, hy, 1, PR.shockRing({ t, r0: 90, r1: 700, w: 18 })); }).join('') : '';
    const cliff = `<path d="M-50,1100 L-50,900 Q300,840 620,880 Q900,900 1200,860 Q1500,840 1980,920 L1980,1100 Z" fill="#3a2a26" ${ink(5)}/><path d="M-50,920 Q300,860 620,900" fill="none" stroke="#5a4136" stroke-width="10" stroke-linecap="round"/>`;
    return { cam, bg: `${T.sky('dusk')}${T.sun(1480, 650, 150)}${T.seaBand(650, 430, '#27384a', '#f2a65e', f, 3)}${ray > 0 ? `<circle cx="${hx}" cy="${n1(hy)}" r="${n1(700 * Math.min(1, ray))}" fill="url(#goldGlow)"/>${rays}` : ''}${cliff}${motes(f, 24, { col: '#ffe2b0', seed: 7 })}`,
      fg: `${shadow(960, 892, 150, 0.25)}${G(960, 896, 1.05, on ? K2.achilles({ pose: 'scream', arms: 'out', shieldOn: false, spear: false, expr: 'scream' }) : K2.achilles({ head: {}, expr: 'proud', breathe: bob(f), headTilt: -4 * win(l, 6, sc - R.SH[45].a) }))}
        ${on ? shakeLines(hx, hy, 130, f) + rings : ''}`,
      hud: popLabel(f, sc + 6, 1430, 470, 130, 'LOUD', { rot: 8, fill: '#f6d35b' }),
      over: flash(f, att, 4, '#fff6d8') };
  } },
] });
