<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Achilles – props sheet</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #stage { width: 1920px; height: 1080px; }
  svg { display: block; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="../lib/cast.js"></script>
<script src="../lib/props.js"></script>
<script>
// Props sheet: every animal, vehicle and object of the full episode, 4 pages (frames 0–3). ?f=<frame> animates the moving ones.
const { C, INK } = window.CAST;
const P = window.PROPS;
const q = new URLSearchParams(location.search);
const AF = +(q.get('f') || 12);

function meander(y, h, col, bg) {
  let s = `<rect x="0" y="${y}" width="1920" height="${h}" fill="${bg}"/>`;
  const k = h * 0.62, top = y + (h - k) / 2;
  for (let x = -10; x < 1930; x += k * 1.25) {
    const a = k * 0.18;
    s += `<path d="M${x},${top + k} L${x},${top} L${x + k},${top} L${x + k},${top + k - a} L${x + a * 1.6},${top + k - a} L${x + a * 1.6},${top + a * 1.6} L${x + k - a * 1.6},${top + a * 1.6}" fill="none" stroke="${col}" stroke-width="${a * 0.9}"/>
      <path d="M${x},${top + k} L${x + k * 1.25},${top + k}" stroke="${col}" stroke-width="${a * 0.9}"/>`;
  }
  return s;
}
const lab = (x, y, t) => `<text x="${x}" y="${y}" text-anchor="middle" font-family="Segoe UI Black, Arial Black, sans-serif" font-size="24" fill="#fff" stroke="${INK}" stroke-width="7" paint-order="stroke" stroke-linejoin="round">${t}</text>`;
const at = (x, y, s, svg) => `<g transform="translate(${x} ${y}) scale(${s})">${svg}</g>`;

const PAGES = [
  ['animals · vehicles · furniture', () => [
    [210, 470, 0.62, P.horse({ gait: 'walk', phase: AF / 30 }), 'HORSE (walk)'],
    [610, 470, 0.62, P.horse({ gait: 'gallop', phase: 0.3, coat: '#e9e1d3', coatS: '#c7bba6', coatD: '#9c9080', muzzle: '#f4ece0', mane: '#8a8178', maneS: '#6a625a', expr: 'wild', blanket: true }), 'HORSE (gallop)'],
    [1000, 470, 0.8, P.deer({ phase: 0.25 }), 'DEER'],
    [1360, 470, 0.85, P.boarKO(), 'BOAR (KO)'],
    [1590, 470, 0.85, P.dog({ tongue: true }), 'DOG'],
    [1790, 470, 0.95, P.rabbit({ bandage: true }), 'RABBIT'],
    [130, 940, 0.55, P.chariotTeam({ phase: 0.75 }), 'CHARIOT TEAM'],
    [780, 940, 0.62, P.chariot({ pole: false, spin: 0.3 }), 'CHARIOT'],
    [1010, 940, 0.55, P.throne(), 'THRONE'],
    [1200, 940, 0.75, P.stool(), 'STOOL'],
    [1420, 940, 0.62, P.armorStand({ giftTag: true, tagSwing: 6 }), 'ARMOR STAND'],
    [1700, 940, 0.4, P.tent({ lit: true }), 'TENT (lit)'],
    [1840, 940, 0.62, P.armorStand({ empty: true }), 'EMPTY'],
  ]],
  ['objects', () => [
    [170, 330, 1.2, P.lyre({ pluck: 3, amp: 5 }), 'LYRE'],
    [420, 330, 1.2, P.goldenApple({ r: 70, glow: 1, text: 1 }), 'GOLDEN APPLE'],
    [640, 330, 1.2, P.dice({ rot: -20 }) + `<g transform="translate(70 40)">${P.dice({ rot: 30, side: 2 })}</g>`, 'DICE (knucklebones)'],
    [880, 380, 0.9, P.cauldron(), 'CAULDRON'],
    [1090, 400, 0.6, P.cauldronTower({ n: 8, wobble: 12 }), 'CAULDRON TOWER'],
    [1310, 370, 0.8, P.goldBars(), 'GOLD BARS'],
    [1520, 370, 1.3, P.cityIcon({ flag: 1 }), 'CITY (+flag)'],
    [1760, 330, 1.2, P.tiara(), 'TIARA'],
    [220, 860, 0.85, P.goldenJar({ leaves: true }), 'GOLDEN JAR'],
    [560, 730, 1.0, P.worldShield({ R: 220, rot: AF * 0.3 }), 'NEW SHIELD (the world)'],
    [1010, 720, 0.55, P.shears({ open: 14 }) + `<g transform="translate(560 0)">${P.thread({ len: 140 })}</g>`, 'SHEARS + THREAD'],
    [1460, 700, 0.6, P.threadBall({ r: 150 }), 'EVERYONE ELSE'],
    [1460, 860, 1, P.thread({ len: 120, cut: 0.8 }), 'THREAD (cut)'],
    [1760, 900, 0.65, P.balanceScale({ tilt: 12, left: P.cityIcon({ s: 0.5 }), right: P.goldBars({ n: 2, s: 0.5 }) }), 'BALANCE'],
  ]],
  ['forge · fire · documents', () => [
    [160, 440, 1.0, P.anvil() + `<g transform="translate(90 -170)">${P.hammer({ angle: 40 })}</g>`, 'ANVIL + HAMMER'],
    [420, 440, 1.0, P.torch({ f: AF }), 'TORCH'],
    [640, 440, 0.8, P.fire({ f: AF }), 'FIRE'],
    [930, 440, 0.8, P.fire({ f: AF, magic: true }), 'MAGIC FIRE'],
    [1150, 440, 1.2, P.candle({ f: AF }), 'CANDLE'],
    [1460, 330, 0.55, P.vasePainting({ empty: 3 }), 'VASE FRIEZE (empty slot)'],
    [1460, 470, 0.5, P.banner({ text: 'SWIFT-FOOTED ACHILLES', u: 1, w: 960 }), 'BANNER'],
    [230, 820, 0.62, P.scrollDoc({ title: 'THE OFFER', lines: ['Gold', 'Horses', 'Seven cities', 'A princess', 'Twenty cauldrons'], reveal: 4.5 }), 'SCROLL DOC'],
    [560, 860, 0.9, P.quill({ angle: 0 }), 'QUILL'],
    [800, 800, 0.9, P.laurel({ R: 120 }), 'LAUREL'],
    [1050, 900, 0.9, P.cradle({ q: true }), 'CRADLE ?'],
    [1290, 780, 0.8, P.pauseIcon(), 'PAUSE'],
    [1640, 830, 0.62, P.talliesStone({ count: 9, grow: 0.6, label: 'YEARS' }), 'TALLY STONE'],
  ]],
  ['map · effects · weapons · food', () => [
    [400, 410, 0.62, P.mapGreece({ wrongLabel: 'WRONG COUNTRY' }) + P.mapRoute({ t: 1, wrong: true, ship: true }) + `<g transform="translate(${P.MAP.mysia[0]} ${P.MAP.mysia[1]})">${P.xMark({ size: 60, t: 1 })}</g>`, 'MAP + ROUTE + X'],
    [1000, 300, 0.7, P.fightCloud({ f: AF, apple: true }), 'FIGHT CLOUD'],
    [1300, 330, 0.8, `<g transform="translate(0 0)">${P.shockRing({ t: 0.35, r0: 30, r1: 260 })}</g><circle r="60" fill="${C.skin}" stroke="${INK}" stroke-width="4"/><g transform="translate(0 0)">${P.flameHalo({ r: 60, f: AF })}</g><circle r="60" fill="${C.skin}" stroke="${INK}" stroke-width="4"/>`, 'SHOCK RING + HALO'],
    [1560, 330, 0.9, P.dustCloud({ t: 0.35 }) + `<g transform="translate(-200 -260)">${P.speedLines({ w: 400, h: 160, f: AF })}</g>`, 'DUST + SPEED LINES'],
    [1800, 300, 0.9, P.bird({ flap: 0.2 }) + `<g transform="translate(60 40)">${P.bird({ flap: 0.7, s: 0.8 })}</g>`, 'BIRDS'],
    [170, 960, 0.8, P.sword({ drawn: 0.6 }), 'SWORD'],
    [300, 960, 0.6, P.spear(), 'SPEAR'],
    [480, 820, 1, P.bow({ draw: 0.6, arrow: true }), 'BOW'],
    [700, 830, 1, P.arrowShaft({ len: 220 }), 'ARROW'],
    [880, 900, 0.9, P.helmetProp({ strap: true }), 'HELMET'],
    [1150, 960, 0.6, P.lootPile() + `<g transform="translate(330 0)">${P.lootPile({ big: false })}</g>`, 'LOOT: HIS / EVERYONE ELSE'],
    [1460, 960, 0.5, P.parasol(), 'PARASOL'],
    [1600, 860, 0.9, P.plate(), 'PLATE'],
    [1820, 960, 0.9, P.breakfastBowl({ f: AF }), 'BREAKFAST'],
    [1150, 640, 0.8, P.speechBubble({ text: 'um–', w: 220, h: 120, tail: [-90, 120] }) + `<g transform="translate(320 0)">${P.thoughtBubble({ text: 'USELESS', w: 300, h: 150, size: 44 })}</g>`, 'BUBBLES'],
  ]],
];

function sheet(page) {
  const [title, items] = PAGES[page];
  return `<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs><linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4e5c6"/><stop offset="1" stop-color="#e3cb9f"/></linearGradient></defs>
  <rect width="1920" height="1080" fill="url(#wall)"/>${meander(96, 36, '#f4e5c6', C.teal)}
  <text x="50" y="70" font-family="Segoe UI Black, Arial Black, sans-serif" font-size="40" fill="#fff" stroke="${INK}" stroke-width="9" paint-order="stroke" stroke-linejoin="round">PROPS ${page + 1}/4 · ${title.toUpperCase()}</text>
  ${items().map(([x, y, s, svg, name]) => `${at(x, y, s, svg)}${lab(x, y + 50, name)}`).join('')}
</svg>`;
}

const stage = document.getElementById('stage');
window.TOTAL_FRAMES = PAGES.length;
window.renderFrame = async f => { stage.innerHTML = sheet(f % PAGES.length); };
window.READY = document.fonts.ready.then(() => window.renderFrame(0));
</script>
</body>
</html>
